services:

  backend:
    build:
      context: ./Natillera.Backend
      dockerfile: Dockerfile
    container_name: natillera-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=natillera;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./Natillera.Frontend
      dockerfile: Dockerfile
    container_name: natillera-web
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:18-alpine
    container_name: natillera-postgres
    environment:
      POSTGRES_DB: natillera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d natillera"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: